name: Sombrio builds

# Release builds of Sombrio for Android: Moonfin's Flutter app, with the Music tab, sombrAMP (music/sombrAMP), as a
# package of it. Every run uploads one APK per ABI as artifacts.
#
# Builds of main whose APKs are signed with the key from the secrets, and that open on Android emulators
# (smoke-test.yaml), are also published as GitHub releases tagged build-<number>. The app offers them as updates
# (lib/sombrio/sombrio_updates.dart), as the Sombrio builds before Moonfin did. The five newest are kept.
#
# Optional repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#     sign the APKs with your own key. Without them each build gets a throwaway key, so a newer build only installs
#     over an older one after uninstalling it, and nothing is released.

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Flutter version both Moonfin and sombrAMP build with (FLUTTER_VERSION in music/sombrAMP/.github/workflows/sombramp.yml)
  FLUTTER_VERSION: '3.47.7'

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Free up disk space
        run: sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/share/powershell

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # pub doesn't generate a dependency's translations, which sombrAMP doesn't commit
      - name: Generate sombrAMP's translations
        working-directory: music/sombrAMP
        run: flutter gen-l10n

      - name: Set up signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Where android/app/build.gradle.kts looks for them
          keystore=android/app/release.keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            alias="$KEY_ALIAS"
            store_password="$KEYSTORE_PASSWORD"
            key_password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "The APKs are signed with the release key from the repository secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            alias=sombrio
            store_password="$(openssl rand -hex 16)"
            key_password="$store_password"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -alias "$alias" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$store_password" -keypass "$key_password" -dname "CN=Sombrio"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: these APKs are signed with a throwaway key."
            echo "The APKs are signed with a throwaway key. To install a later build over one, uninstall it first, or add the ANDROID_KEYSTORE_* secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          # Fails here, with a clear error, when the keystore or its password is wrong
          keytool -list -keystore "$keystore" -storepass "$store_password" > /dev/null
          cat > android/keystore.properties <<EOF
          storePassword=$store_password
          keyAlias=$alias
          keyPassword=$key_password
          EOF

      # Every build gets a higher number than the last, which is its release's tag and, with the ABI in front of it
      # (Flutter adds 1000, 2000 or 4000 for armeabi-v7a, arm64-v8a and x86_64), its versionCode, so Android installs
      # it as an update. 100 keeps it above the Sombrio builds before Moonfin, which numbered themselves the same way.
      - name: Number the build
        run: echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # SOMBRIO tells sombrAMP it runs inside Sombrio (music/sombrAMP/lib/sombra/sombrio_host.dart), SOMBRIO_BUILD is
      # the number the updater compares releases with, and DISTRIBUTION_CHANNEL turns Moonfin's update check on.
      - name: Build the APKs
        run: |
          flutter build apk --release --flavor mobile --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-number "$BUILD_NUMBER" \
            --dart-define=SOMBRIO=true \
            --dart-define=SOMBRIO_BUILD="$BUILD_NUMBER" \
            --dart-define=DISTRIBUTION_CHANNEL=apk

      - name: Name the APKs
        run: |
          mkdir apks
          for apk in build/app/outputs/flutter-apk/app-*-mobile-release.apk; do
            abi="${apk##*/app-}"
            abi="${abi%-mobile-release.apk}"
            cp "$apk" "apks/sombrio-${GITHUB_REF_NAME//\//-}-$abi.apk"
          done
          ls -l apks

      # Each APK is Sombrio's, for one ABI, with the Flutter engine and the app compiled for it
      - name: Check the APKs
        run: |
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="$(ls apks/*-"$abi".apk)" || { echo "::error::No APK for $abi"; exit 1; }
            files="$(unzip -Z1 "$apk")"
            for file in "lib/$abi/libflutter.so" "lib/$abi/libapp.so" assets/flutter_assets/; do
              grep -q "^$file" <<< "$files" || { echo "::error::$apk has no $file"; exit 1; }
            done
            badging="$("$aapt2" dump badging "$apk")"
            grep -q "package: name='wtf.sombra.sombrio'" <<< "$badging" ||
              { echo "::error::$apk isn't wtf.sombra.sombrio"; exit 1; }
            echo "$abi: ${badging%%$'\n'*}"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: sombrio-android
          path: apks/*.apk
          compression-level: 0 # an APK is already compressed

  # Each build has to open on Android emulators before it's released
  smoke-test:
    name: Smoke test
    needs: android
    uses: ./.github/workflows/smoke-test.yaml
    with:
      artifact: sombrio-android

  release:
    name: Release
    needs: [android, smoke-test]
    if: github.ref == 'refs/heads/main' && needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish releases
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: sombrio-android
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          build="$((100 + GITHUB_RUN_NUMBER))"
          tag="build-$build"
          mkdir release
          # Named by ABI, which the app's updater picks its APK by
          for apk in artifacts/*.apk; do
            abi="${apk##*-main-}"
            cp "$apk" "release/sombrio-build-$build-$abi"
          done
          ls -l release
          # The notes say what changed: a merged pull request's title, or the commit's subject
          subject="$(git log -1 --format=%s)"
          case "$subject" in
            "Merge pull request"*) notes="$(git log -1 --format=%b)" ;;
            *) notes="$subject" ;;
          esac
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Sombrio build $build" \
            --notes "$notes" --latest
          echo "Released as [$tag](https://github.com/$GH_REPO/releases/tag/$tag)." >> "$GITHUB_STEP_SUMMARY"

          # Keep the five newest builds
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:][] | .tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
